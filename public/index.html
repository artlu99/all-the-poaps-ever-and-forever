<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>poaps</title>
  <meta name="description" content="Explore any Ethereum address's POAP collection — beautiful, fast, mobile-first.">
  <meta name="theme-color" content="#0b0d16">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- X / OpenGraph embed. {{ORIGIN}} and {{PLAYER_URL}} are replaced at serve
       time so image and player URLs are absolute; per-wallet pages (/p/:owner)
       additionally swap the title and point the player at /play/:owner. -->
  <meta name="twitter:card" content="player">
  <meta name="twitter:title" content="{{TWITTER_TITLE}}">
  <meta name="twitter:description" content="{{TWITTER_DESC}}">
  <meta name="twitter:player" content="{{PLAYER_URL}}">
  <meta name="twitter:player:width" content="480">
  <meta name="twitter:player:height" content="480">
  <meta name="twitter:image" content="{{ORIGIN}}/og.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="poaps">
  <meta property="og:title" content="{{TWITTER_TITLE}}">
  <meta property="og:description" content="{{TWITTER_DESC}}">
  <meta property="og:image" content="{{ORIGIN}}/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="600">
  <meta property="og:url" content="{{ORIGIN}}/">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div id="stars"></div>
  </div>

  <!-- HOME -->
  <main id="home" class="screen">
    <div class="brand">
      <div class="brand-coin" aria-hidden="true"><div class="brand-inner">🎟️</div></div>
      <h1>poaps</h1>
    </div>
    <p class="tag">Paste an address or ENS name —<br>see the badges they've collected.</p>
    <form id="lookup" autocomplete="off">
      <div class="input-row">
        <input id="addr" type="text" inputmode="text" spellcheck="false" autocapitalize="off"
               placeholder="vitalik.eth  ·  0xabc…def1" aria-label="Ethereum address or ENS name">
        <button type="button" id="paste" class="icon-btn" title="Paste from clipboard" aria-label="Paste from clipboard">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" rx="1.5" width="8" height="4" opacity=".45"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        </button>
      </div>
      <button type="submit" id="go">Explore POAPs</button>
      <p class="error" id="home-error" hidden></p>
    </form>
    <div id="recent-wrap" hidden>
      <p class="recent-label">recent</p>
      <div id="recent"></div>
    </div>
    <footer>
      <span>archival snapshot</span><span class="dot-sep">·</span>
      <a href="https://poaparchive.com" target="_blank" rel="noopener">poaparchive.com</a>
      <span class="dot-sep">·</span><span id="snapshot-date">Aug 2026</span>
      <span class="dot-sep">·</span>
      <a class="gh" href="https://github.com/artlu99/all-the-poaps-ever-and-forever" target="_blank" rel="noopener"
         title="Source code — MIT licensed">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub <span>(MIT)</span>
      </a>
    </footer>
  </main>

  <!-- COLLECTION -->
  <main id="grid" class="screen" hidden>
    <header id="topbar">
      <button id="back" class="icon-btn" aria-label="Back to home">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="who">
        <canvas id="identicon" width="72" height="72" aria-hidden="true"></canvas>
        <div class="who-text">
          <div id="who-name">…</div>
          <button id="who-addr" class="mono" title="Copy address"></button>
        </div>
      </div>
      <button id="share" class="icon-btn" aria-label="Share">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      </button>
    </header>

    <div id="subbar">
      <span id="count-badge"></span>
      <span id="zoom-badge" class="pill" title="Swipe ↕ to zoom"></span>
    </div>

    <div id="pager">
      <div id="pages"></div>
      <div id="empty" hidden>
        <div class="empty-coin">🫥</div>
        <p>No POAPs for this address<br>in the snapshot.</p>
      </div>
    </div>

    <div id="hud">
      <div id="dots"></div>
      <div id="hint">swipe ↔ browse · swipe ↕ zoom</div>
    </div>

    <div id="loading" hidden>
      <div class="load-coin"></div>
      <p id="loading-text">fetching badges…</p>
    </div>
  </main>

  <!-- DETAIL SHEET -->
  <div id="sheet-backdrop" hidden></div>
  <section id="sheet" class="sheet" hidden aria-modal="true" role="dialog">
    <div id="sheet-grab"><span></span></div>
    <div id="sheet-body">
      <div class="sheet-coin-wrap"><img id="sheet-img" alt=""></div>
      <h2 id="sheet-title"></h2>
      <div id="sheet-chips" class="chips"></div>
      <dl id="sheet-meta"></dl>
      <p id="sheet-desc"></p>
      <div class="sheet-actions">
        <a id="sheet-url" class="btn ghost" target="_blank" rel="noopener" hidden>event website ↗</a>
      </div>
      <p class="sheet-ids mono" id="sheet-ids"></p>
    </div>
  </section>

  <div id="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
