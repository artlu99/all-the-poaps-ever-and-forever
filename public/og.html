<!doctype html>
<!-- OG card template — screenshot at exactly 1200x600 into public/og.png.
     Served from public/ so it can pull real badge artwork from /a/: -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1200px; height: 600px; overflow: hidden;
    background: radial-gradient(900px 600px at 88% -10%, rgba(70,216,216,.10), transparent 60%),
                radial-gradient(800px 560px at -8% 110%, rgba(255,122,195,.08), transparent 60%),
                #0b0d16;
    font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .star { position: absolute; border-radius: 50%; background: #edeff7; }
  .wrap { position: relative; z-index: 1; display: flex; height: 100%; align-items: center;
    padding: 0 72px; gap: 30px; box-sizing: border-box; }
  .left { flex: 1; }
  h1 { font-size: 128px; font-weight: 800; letter-spacing: -0.045em; margin: 0 0 20px; line-height: 1;
    background: linear-gradient(92deg, #fff 18%, #8b7cff 55%, #46d8d8 88%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { color: #9aa1bd; font-size: 27px; line-height: 1.5; margin: 0 0 34px; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; }
  .stat { padding: 11px 20px; border-radius: 999px; background: rgba(21,25,42,.62);
    border: 1px solid rgba(139,124,255,.18); color: #edeff7; font-size: 20px; }
  .stat b { color: #46d8d8; font-weight: 700; }
  .fan { position: relative; width: 440px; height: 440px; flex-shrink: 0; }
  .coin { position: absolute; left: 50%; top: 50%; width: 168px; height: 168px; margin: -84px 0 0 -84px;
    border-radius: 50%; padding: 5px; box-sizing: border-box;
    background: conic-gradient(from 220deg, #8b7cff, #46d8d8, #ff7ac3, #8b7cff);
    box-shadow: 0 20px 46px rgba(0,0,0,.55); }
  .coin img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;
    background: radial-gradient(circle at 35% 30%, #232949, #12162b); }
</style>
</head>
<body>
  <div class="star" style="left:640px;top:70px;width:2px;height:2px;opacity:.5"></div>
  <div class="star" style="left:760px;top:150px;width:3px;height:3px;opacity:.3"></div>
  <div class="star" style="left:880px;top:60px;width:2px;height:2px;opacity:.6"></div>
  <div class="star" style="left:1050px;top:200px;width:2px;height:2px;opacity:.4"></div>
  <div class="star" style="left:960px;top:500px;width:3px;height:3px;opacity:.3"></div>
  <div class="star" style="left:700px;top:530px;width:2px;height:2px;opacity:.5"></div>
  <div class="wrap">
    <div class="left">
      <h1>poaps</h1>
      <p class="tag">The archival POAP explorer.<br>Paste any address or ENS name — swipe through its badges.</p>
      <div class="stats">
        <span class="stat"><b>6.2M</b> badges</span>
        <span class="stat"><b>1.24M</b> collectors</span>
        <span class="stat"><b>74k</b> events</span>
      </div>
    </div>
    <div class="fan">
      <!-- arc of six real badges from the archive -->
      <div class="coin" style="transform: rotate(-52deg) translateY(-138px) rotate(52deg) scale(.92)"><img src="/a/1.webp" alt=""></div>
      <div class="coin" style="transform: rotate(-30deg) translateY(-150px) rotate(30deg)"><img src="/a/2.webp" alt=""></div>
      <div class="coin" style="transform: rotate(-8deg) translateY(-156px) rotate(8deg) scale(1.05)"><img src="/a/226135.webp" alt=""></div>
      <div class="coin" style="transform: rotate(14deg) translateY(-150px) rotate(-14deg)"><img src="/a/18360.webp" alt=""></div>
      <div class="coin" style="transform: rotate(36deg) translateY(-138px) rotate(-36deg) scale(.92)"><img src="/a/82762.webp" alt=""></div>
      <div class="coin" style="transform: rotate(58deg) translateY(-120px) rotate(-58deg) scale(.82)"><img src="/a/5989.webp" alt=""></div>
    </div>
  </div>
</body>
</html>
