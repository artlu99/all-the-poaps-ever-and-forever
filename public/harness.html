<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>poaps player harness</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a1d27; color: #c9cde0; font: 14px/1.4 system-ui, sans-serif; }
    main { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    p { max-width: 440px; margin: 0; }
    iframe { border: 0; background: #0b0d16; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  </style>
</head>
<body>
  <main>
    <p>Approximate the X timeline card. The sandbox drops storage the way a sandboxed player iframe does. Swap the src path to try another wallet.</p>
    <iframe
      title="poaps player"
      src="/play/vitalik.eth"
      sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"
      width="440"
      height="480"></iframe>
  </main>
</body>
</html>
